<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width , initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Calculator</h1>
  <div id="calculator">
    <input type="text" id="expression" autocomplete="off" autofocus spellcheck="false">
    <div id="output"></div>

    <div id="keys">
  <button data-action="clear">AC</button>
  <button data-action="backspace">DEL</button>
  <button data-value="(">(</button>
  <button data-value=")">)</button>

  <button data-value="sin(">sin</button>
  <button data-value="cos(">cos</button>
  <button data-value="tan(">tan</button>
  <button data-value="sqrt(">sqrt</button>

  <button data-value="pi">pi</button>
  <button data-value="e">e</button>
  <button data-value="^">^</button>
  <button data-value="/">/</button>

  <button data-value="7">7</button>
  <button data-value="8">8</button>
  <button data-value="9">9</button>
  <button data-value="*">*</button>

  <button data-value="4">4</button>
  <button data-value="5">5</button>
  <button data-value="6">6</button>
  <button data-value="-">-</button>

  <button data-value="1">1</button>
  <button data-value="2">2</button>
  <button data-value="3">3</button>
  <button data-value="+">+</button>

  <button data-value="0">0</button>
  <button data-value=".">.</button>
  <button data-action="equals">=</button>
</div>
    <div id="variables">
  <h2>Variables</h2>
  <input type="text" id="var-name" placeholder="name (e.g. x)">
  <input type="text" id="var-value" placeholder="value (e.g. 5)">
  <button id="add-var">Add</button>
  <button id="clear-var">Clear</button>
  <div id="var-message"></div> 
  <ul id="var-list"></ul>   

 </div>
   <div id="history">
  <h2>History</h2>
  <ul id="history-list"></ul>
</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
